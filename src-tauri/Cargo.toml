[package]
name = "bug-finder"
version = "0.2.0"
description = "A course and drill set for finding subtle bugs in AI-generated code."
edition = "2021"
rust-version = "1.77"

[lib]
name = "bug_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
